name: Publish npm package
run-name: Publish @vastermortgage/email@${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json to publish (for example, 0.1.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.1'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.1'
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (version !== process.env.RELEASE_VERSION) {
            throw new Error(`Requested version must match package.json (${version})`);
          }
          JS
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Publish with npm trusted publishing
        run: npm publish --access public
